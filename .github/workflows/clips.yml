name: Clips GTA 6

on:
  schedule:
    - cron: "0 * * * *"   # toutes les heures
  workflow_dispatch:       # bouton « Run workflow » pour lancer à la main

permissions:
  contents: write          # pour créer les Releases et mémoriser les clips déjà faits

concurrency:
  group: clips
  cancel-in-progress: false

jobs:
  clips:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Garder le modèle de sous-titres en cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small

      - name: Ouvrir la branche « media » (hébergement des vidéos)
        run: |
          git config --global user.name "clips-bot"
          git config --global user.email "clips-bot@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin media; then
            git fetch -q origin media
            git worktree add media_branch -B media origin/media
          else
            git worktree add --orphan -b media media_branch
          fi

      - name: Fabriquer et publier les clips
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python clipper.py

      - name: Mémoriser les clips déjà traités
        run: |
          git add posted.json
          git diff --cached --quiet || (git commit -m "Clips traités" && git push)
